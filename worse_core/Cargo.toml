[package]
name = "worse_core"
version = "0.1.0"
edition = "2024"

[dependencies]
thiserror = { workspace = true }
raw-window-handle = { workspace = true }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Dwm",
    "Win32_UI_Input_KeyboardAndMouse",
] }
tracing = { workspace = true }
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["time", "local-time"] }
time = { version = "0.3.54", features = [
    "formatting",
    "parsing",
    "local-offset",
    "macros",
] }
