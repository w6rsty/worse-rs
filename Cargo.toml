[workspace]
members = [".", "worse_core", "worse_rhi", "worse_shader/compiler"]
resolver = "3"

[package]
name = "worse"
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
thiserror = "2.0.19"
raw-window-handle = { version = "0.6.2", features = ["std"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
bitflags = "2.13.1"
tracing = "0.1.44"
arrayvec = "0.7.8"
mint = "0.5.9"
glam = "0.34.0"
ash = { git = "https://github.com/ash-rs/ash", rev = "a9a1fb17e98a0cde146caada86200d809306200d" }
slang-auto = { git = "https://github.com/w6rsty/slang-auto", rev = "460899fef4a05703bc5e3c991e14f6e6961939c9" }

worse_core = { path = "worse_core" }
worse_rhi = { path = "worse_rhi", default-features = false }
worse_shader_compiler = { path = "worse_shader/compiler" }

[dev-dependencies]
bytemuck = { workspace = true }
bitflags = { workspace = true }
glam = { workspace = true }
mint = { workspace = true }
rand = "0.9"
arrayvec = { workspace = true }
worse_core = { workspace = true }
worse_rhi = { workspace = true, features = ["vulkan"] }
worse_shader_compiler = { workspace = true }
