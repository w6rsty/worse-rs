[package]
name = "worse"
version = "0.1.0"
edition = "2024"

[dependencies]
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["time", "local-time"] }
time = { version = "0.3.54", features = [
    "formatting",
    "parsing",
    "local-offset",
    "macros",
] }
