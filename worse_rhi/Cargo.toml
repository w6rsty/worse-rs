[package]
name = "worse_rhi"
version = "0.1.0"
edition = "2024"

[features]
default = ["vulkan"]
vulkan = ["dep:ash", "dep:ash-window"]

[dependencies]
thiserror = { workspace = true }
arrayvec = { workspace = true }
raw-window-handle = { workspace = true }
bitflags = { workspace = true }
tracing = { workspace = true }
ash = { workspace = true, optional = true }
ash-window = { git = "https://github.com/ash-rs/ash", rev = "a9a1fb17e98a0cde146caada86200d809306200d", package = "ash-window", optional = true }
bytemuck = { workspace = true }

worse_core = { path = "../worse_core" }
